<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login - AgroControl</title>

    <link rel="stylesheet" href="assets/public/styles/login.css">
</head>
<body>

    <div class="container">

        <div class="left-panel">

            <div class="overlay"></div>

            <div class="left-content">

                <h1>🌾 AgroControl</h1>

                <p>
                    Controle animais, despesas e lucros da sua fazenda em um único sistema.
                </p>

            </div>

        </div>

        <div class="right-panel">

            <form id="form-login" class="login-box">

                <h2>Entrar</h2>

                <p class="subtitle">
                    Faça login para acessar sua conta
                </p>

                <input name="email" type="email" placeholder="Digite seu email" required >

                <input name="password" type="password" placeholder="Digite sua senha" required >

                <button type="submit">Entrar</button>

                <div class="links">
                    <a href="cadastro.html">Criar conta</a>
                    <a href="../index.html">Voltar</a>
                </div>

            </form>

        </div>

    </div>

    <script src="assets/public/scripts/login.js"></script>

</body>
</html>
