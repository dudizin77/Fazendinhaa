<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cadastro - AgroControl</title>

    <link rel="stylesheet" href="assets/public/styles/login.css">
    <script src="assets/public/scripts/cadastro.js" defer></script>
</head>
<body>

    <div class="container">

        <div class="left-panel">

            <div class="overlay"></div>

            <div class="left-content">

                <h1>🚜 AgroControl</h1>

                <p>
                    Crie sua conta e comece a gerenciar sua fazenda.
                </p>

            </div>

        </div>

        <div class="right-panel">

            <form class="login-box">

                <h2>Criar Conta</h2>

                <p class="subtitle">
                    Preencha os dados abaixo
                </p>

                <input type="text" name="name" placeholder="Nome completo" required>

                <input type="email" name="email" placeholder="Digite seu email" required>

                <input type="password" name="password" placeholder="Crie uma senha" required>

                <label for="accountType" style="margin-top: 10px;">Tipo de conta:</label>
                <select name="accountType" id="accountType" required>
                    <option value="cliente">Cliente</option>
                    <option value="admin">Administrador</option>
                </select>

                <button type="submit">Cadastrar</button>

                <div class="links">
                    <a href="login.html">Já tenho conta</a>
                    <a href="../index.html">Voltar</a>
                </div>

            </form>

        </div>

    </div>

</body>
</html>
