<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - AgroControl</title>
    <link rel="stylesheet" href="../_common/styles/reset.css">
    <link rel="stylesheet" href="../public/styles/home.css">
    <style>
        .card-link { text-decoration: none; color: inherit; }
        .card-link:hover { transform: translateY(-4px); }
    </style>
</head>
<body>
    <header class="header" style="background: linear-gradient(90deg,#1f4d2e 60%,#3fa35c 100%); color: #fff; padding: 24px 0 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.07);">
        <div style="display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;">
            <h1 style="font-size:2.2rem;letter-spacing:1px;display:flex;align-items:center;gap:10px;">⚙️ Painel Admin</h1>
            <nav style="display:flex;gap:18px;">
                <a href="../../index.html" style="color:#fff;text-decoration:none;font-weight:500;">Início</a>
                <a href="#" id="logout" style="background:#fff;color:#1f4d2e;padding:8px 22px;border-radius:8px;text-decoration:none;font-weight:600;cursor:pointer;">Sair</a>
            </nav>
        </div>
    </header>
    <script>
    // Garantir que apenas admin acesse esta página
    (function(){
        try {
            const logged = localStorage.getItem('agrocontrolLogged');
            const isAdmin = localStorage.getItem('agrocontrolIsAdmin');
            if (!logged || isAdmin !== 'true') {
                // redireciona para login
                window.location.href = '../../login.html';
            }
        } catch (e) {
            window.location.href = '../../login.html';
        }
    })();
    </script>
    <main style="max-width:1100px;margin:40px auto 0 auto;padding:0 16px;">
        <h2 style="color:#1f4d2e;font-size:2rem;margin-bottom:24px;">Bem-vindo ao Painel Administrativo!</h2>
        <div style="display:flex;gap:32px;flex-wrap:wrap;justify-content:center;">
            <a href="especies.html" class="card-link" style="flex:1 1 260px;min-width:260px;background:#fff;padding:32px 24px;border-radius:15px;box-shadow:0 0 10px rgba(0,0,0,0.08);transition:transform 0.2s;text-decoration:none;color:inherit;">
                <h3 style="color:#3fa35c;margin-bottom:12px;">🔬 Gerenciar Espécies</h3>
                <p>Adicione, edite ou remova espécies de animais.</p>
            </a>
            <a href="racas.html" class="card-link" style="flex:1 1 260px;min-width:260px;background:#fff;padding:32px 24px;border-radius:15px;box-shadow:0 0 10px rgba(0,0,0,0.08);transition:transform 0.2s;text-decoration:none;color:inherit;">
                <h3 style="color:#3fa35c;margin-bottom:12px;">🦴 Gerenciar Raças</h3>
                <p>Gerencie as raças de animais do sistema.</p>
            </a>
            <a href="categorias.html" class="card-link" style="flex:1 1 260px;min-width:260px;background:#fff;padding:32px 24px;border-radius:15px;box-shadow:0 0 10px rgba(0,0,0,0.08);transition:transform 0.2s;text-decoration:none;color:inherit;">
                <h3 style="color:#3fa35c;margin-bottom:12px;">📁 Gerenciar Categorias</h3>
                <p>Gerencie categorias de despesas e lucros.</p>
            </a>
        </div>
    </main>
    <script>
    document.getElementById('logout').onclick = function(e) {
        e.preventDefault();
        localStorage.removeItem('agrocontrolLogged');
        localStorage.removeItem('agrocontrolUser');
        localStorage.removeItem('agrocontrolIsAdmin');
        window.location.href = '../../index.html';
    }
    </script>
</body>
</html>
