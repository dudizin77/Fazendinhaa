<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo - AgroControl</title>
    <link rel="stylesheet" href="../assets/_common/styles/reset.css">
    <link rel="stylesheet" href="../assets/public/styles/home.css">
</head>
<body>
    <header class="header" style="background: linear-gradient(90deg,#1f4d2e 60%,#3fa35c 100%); color: #fff; padding: 24px 0 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.07);">
        <div style="display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;">
            <h1 style="font-size:2.2rem;letter-spacing:1px;display:flex;align-items:center;gap:10px;">⚙️ Admin AgroControl</h1>
            <nav style="display:flex;gap:18px;">
                <a href="../index.html" style="color:#fff;text-decoration:none;font-weight:500;">Início</a>
                <a href="#" id="logout" style="background:#fff;color:#1f4d2e;padding:8px 22px;border-radius:8px;text-decoration:none;font-weight:600;">Sair</a>
            </nav>
        </div>
    </header>
    <main style="max-width:1100px;margin:40px auto 0 auto;padding:0 16px;">
        <h2 style="color:#1f4d2e;font-size:2rem;margin-bottom:24px;">Bem-vindo, Administrador!</h2>
        <div style="display:flex;gap:32px;flex-wrap:wrap;">
            <div style="flex:1 1 260px;min-width:260px;background:#fff;padding:32px 24px;border-radius:15px;box-shadow:0 0 10px rgba(0,0,0,0.08);">
                <h3 style="color:#3fa35c;margin-bottom:12px;">Gerenciar Usuários</h3>
                <p>Visualize, edite ou exclua contas de usuários do sistema.</p>
            </div>
            <div style="flex:1 1 260px;min-width:260px;background:#fff;padding:32px 24px;border-radius:15px;box-shadow:0 0 10px rgba(0,0,0,0.08);">
                <h3 style="color:#3fa35c;margin-bottom:12px;">Produtos & Categorias</h3>
                <p>Adicione, edite ou remova produtos e categorias disponíveis.</p>
            </div>
            <div style="flex:1 1 260px;min-width:260px;background:#fff;padding:32px 24px;border-radius:15px;box-shadow:0 0 10px rgba(0,0,0,0.08);">
                <h3 style="color:#3fa35c;margin-bottom:12px;">Relatórios</h3>
                <p>Acesse relatórios detalhados de movimentações e desempenho.</p>
            </div>
        </div>
    </main>
    <script src="../assets/admin/scripts/admin.js"></script>
</body>
</html>
