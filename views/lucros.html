<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Meus Lucros - AgroControl</title>
    <link rel="stylesheet" href="assets/_common/styles/reset.css">
    <link rel="stylesheet" href="assets/public/styles/home.css">
    <style>
        .container { max-width: 1100px; margin: 0 auto; padding: 0 16px; }
        .section { background: #fff; padding: 24px; border-radius: 12px; margin-bottom: 24px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        .form-group { margin-bottom: 16px; }
        input, select { width: 100%; padding: 10px; border: 1px solid #ddd; border-radius: 6px; font-size: 1rem; }
        button { background: #3fa35c; color: #fff; padding: 12px 24px; border: none; border-radius: 6px; cursor: pointer; font-weight: 600; }
        button:hover { background: #2d8a48; }
        button.btn-delete { background: #dc3545; }
        button.btn-delete:hover { background: #c82333; }
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th, td { padding: 12px; text-align: left; border-bottom: 1px solid #eee; }
        th { background: #f7faf7; font-weight: 600; color: #1f4d2e; }
        tr:hover { background: #f7faf7; }
    </style>
</head>
<body>
    <header class="header" style="background: linear-gradient(90deg,#1f4d2e 60%,#3fa35c 100%); color: #fff; padding: 24px 0 12px 0; box-shadow: 0 2px 8px rgba(0,0,0,0.07);">
        <div style="display:flex;align-items:center;justify-content:space-between;max-width:1100px;margin:0 auto;">
            <h1 style="font-size:2.2rem;letter-spacing:1px;display:flex;align-items:center;gap:10px;">💰 Meus Lucros</h1>
            <nav style="display:flex;gap:18px;">
                <a href="app.html" style="color:#fff;text-decoration:none;font-weight:500;">Dashboard</a>
                <a href="#" id="logout" style="background:#fff;color:#1f4d2e;padding:8px 22px;border-radius:8px;text-decoration:none;font-weight:600;cursor:pointer;">Sair</a>
            </nav>
        </div>
    </header>

    <main class="container" style="margin-top: 40px; margin-bottom: 40px;">
        <div class="section">
            <h2 style="color: #1f4d2e; margin-bottom: 24px;">Registrar Novo Lucro</h2>
            <form id="formLucro">
                <div class="form-group">
                    <label>Animal (opcional)</label>
                    <select id="animalSelectLucro" name="animal_id">
                        <option value="">Nenhum (geral)</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Grupo de Animais (opcional)</label>
                    <select id="grupoSelectLucro" name="grupo_id">
                        <option value="">Nenhum</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Categoria de Lucro*</label>
                    <select id="categoriaLucroSelect" name="categoria_id" required>
                        <option value="">Carregando categorias...</option>
                    </select>
                </div>
                <div class="form-group">
                    <label>Descrição*</label>
                    <input type="text" name="descricao" required>
                </div>
                <div class="form-group">
                    <label>Valor (R$)*</label>
                    <input type="number" step="0.01" name="valor" required>
                </div>
                <div class="form-group">
                    <label>Data do Lucro*</label>
                    <input type="date" name="data_lucro" required>
                </div>
                <button type="submit">Registrar Lucro</button>
            </form>
        </div>

        <div class="section">
            <h2 style="color: #1f4d2e; margin-bottom: 24px;">Lucros Registrados</h2>
            <table id="lucrosTable">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Animal</th>
                        <th>Categoria</th>
                        <th>Descrição</th>
                        <th>Valor</th>
                        <th>Data</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr><td colspan="7" style="text-align: center;">Carregando...</td></tr>
                </tbody>
            </table>
        </div>
    </main>

    <script src="assets/public/scripts/app.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', function() {
            // Carregar dados nos selects
            carregarAnimais(document.getElementById('animalSelectLucro'));
            carregarGrupos(document.getElementById('grupoSelectLucro'));
            carregarCategoriasLucros(document.getElementById('categoriaLucroSelect'));
            
            // Listar lucros existentes
            listarLucros();

            // Enviar formulário de novo lucro
            document.getElementById('formLucro').addEventListener('submit', function(e) {
                e.preventDefault();
                const animalVal = this.querySelector('select[name="animal_id"]').value;
                const grupoVal = this.querySelector('select[name="grupo_id"]').value;
                const formData = {
                    animal_id: animalVal ? parseInt(animalVal) : null,
                    grupo_id: grupoVal ? parseInt(grupoVal) : null,
                    categoria_id: parseInt(this.querySelector('select[name="categoria_id"]').value),
                    descricao: this.querySelector('input[name="descricao"]').value,
                    valor: parseFloat(this.querySelector('input[name="valor"]').value),
                    data_lucro: this.querySelector('input[name="data_lucro"]').value
                };
                criarLucro(formData);
                this.reset();
            });
        });
    </script>
</body>
</html>
